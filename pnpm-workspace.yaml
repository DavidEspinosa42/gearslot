# Supply-chain hardening. Versions are pinned exactly in package.json, and a
# release must be at least 7 days (10080 minutes) old before it can be installed.
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
strictDepBuilds: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
savePrefix: ""
# Dependency build scripts are denied by default. Each entry below was reviewed and is not needed:
# esbuild ships prebuilt platform binaries; the others are optional native accelerators.
allowBuilds:
  esbuild: false
  cpu-features: false
  protobufjs: false
  ssh2: false
